<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared file · SafeKeeping</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #070b0a; --ink: #f6f1e6; --muted: #9aa89f; --accent: #e3c27a; --card: #141c1a; --line: #2a3833; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.45 Outfit, sans-serif; color: var(--ink); padding: 24px;
      background:
        radial-gradient(720px 420px at 12% -10%, rgba(227, 194, 122, 0.16), transparent 55%),
        var(--bg);
    }
    main { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .mark {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(160deg, #f0d59a, var(--accent));
      color: #1a1408; display: grid; place-items: center;
    }
    .mark svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    h1 { margin: 0 0 8px; font: 650 24px/1.2 Fraunces, Georgia, serif; }
    p { margin: 0 0 16px; color: var(--muted); }
    button { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 650; background: var(--accent); color: #1a1408; cursor: pointer; }
    .err { color: #e8a0a0; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </div>
      SafeKeeping
    </div>
    <h1>Shared file</h1>
    <p id="status">Opening the link…</p>
    <button type="button" id="save" hidden>Download</button>
  </main>
  <script>
    function unb64url(s) {
      s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    }
    async function decryptBody(buf, fek) {
      const bytes = new Uint8Array(buf);
      if (bytes.length < 29) throw new Error("truncated");
      const iv = bytes.slice(0, 12);
      const ct = bytes.slice(12);
      const key = await crypto.subtle.importKey("raw", fek, "AES-GCM", false, ["decrypt"]);
      return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
    }
    (async () => {
      const status = document.getElementById("status");
      const token = location.pathname.split("/").filter(Boolean).pop();
      const fekPart = location.hash.replace(/^#/, "");
      const res = await fetch("/s/" + encodeURIComponent(token) + "/raw");
      if (!res.ok) {
        status.className = "err";
        status.textContent = res.status === 410 ? "This link has expired." : "This link is missing or the file is gone.";
        return;
      }
      const name = (res.headers.get("Content-Disposition") || "").split("filename=")[1]?.replace(/"/g, "") || "download";
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (fekPart) {
        try { bytes = await decryptBody(bytes.buffer, unb64url(fekPart)); }
        catch { status.className = "err"; status.textContent = "This link is missing its unlock key, or the key is wrong."; return; }
      }
      const blob = new Blob([bytes]);
      const url = URL.createObjectURL(blob);
      status.textContent = name;
      const save = document.getElementById("save");
      save.hidden = false;
      save.onclick = () => {
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
      };
    })();
  </script>
</body>
</html>
