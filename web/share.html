<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared file · SafeKeeping</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #070b0a; --ink: #f6f1e6; --muted: #9aa89f; --accent: #e3c27a; --card: #141c1a; --line: #2a3833; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.45 Outfit, sans-serif; color: var(--ink); padding: 24px;
      background:
        radial-gradient(720px 420px at 12% -10%, rgba(227, 194, 122, 0.16), transparent 55%),
        var(--bg);
    }
    main { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
    main.has-player { width: min(720px, 100%); }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .mark {
      width: 32px; height: 32px; border-radius: 10px;
      overflow: hidden; background: #0a0a0a; flex-shrink: 0;
    }
    .mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    h1 { margin: 0 0 8px; font: 650 24px/1.2 Fraunces, Georgia, serif; word-break: break-word; }
    p { margin: 0 0 16px; color: var(--muted); }
    video, audio { width: 100%; display: block; border-radius: 12px; margin: 0 0 16px; background: #0a0a0a; }
    audio { height: 48px; }
    button { appearance: none; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 650; background: var(--accent); color: #1a1408; cursor: pointer; }
    .err { color: #e8a0a0; }
  </style>
</head>
<body>
  <main id="card">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <img src="/logo.png" alt="" />
      </div>
      SafeKeeping
    </div>
    <h1 id="title">Shared file</h1>
    <p id="status">Opening the link…</p>
    <div id="player"></div>
    <button type="button" id="save" hidden>Download</button>
  </main>
  <script>
    function unb64url(s) {
      s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    }
    function fileExt(name) {
      return (String(name || "").split(".").pop() || "").toLowerCase();
    }
    function mimeFor(name) {
      switch (fileExt(name)) {
        case "mp4": return "video/mp4";
        case "webm": return "video/webm";
        case "mov": return "video/quicktime";
        case "mp3": return "audio/mpeg";
        case "m4a": return "audio/mp4";
        case "wav": return "audio/wav";
        case "ogg":
        case "oga": return "audio/ogg";
        case "pdf": return "application/pdf";
        default: return "application/octet-stream";
      }
    }
    async function decryptBody(buf, fek) {
      const bytes = new Uint8Array(buf);
      if (bytes.length < 29) throw new Error("truncated");
      const iv = bytes.slice(0, 12);
      const ct = bytes.slice(12);
      const key = await crypto.subtle.importKey("raw", fek, "AES-GCM", false, ["decrypt"]);
      return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
    }
    (async () => {
      const status = document.getElementById("status");
      const token = location.pathname.split("/").filter(Boolean).pop();
      const fekPart = location.hash.replace(/^#/, "");
      const res = await fetch("/s/" + encodeURIComponent(token) + "/raw");
      if (!res.ok) {
        status.className = "err";
        status.textContent = res.status === 410 ? "This link has expired." : "This link is missing or the file is gone.";
        return;
      }
      const name = (res.headers.get("Content-Disposition") || "").split("filename=")[1]?.replace(/"/g, "") || "download";
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (fekPart) {
        try { bytes = await decryptBody(bytes.buffer, unb64url(fekPart)); }
        catch { status.className = "err"; status.textContent = "This link is missing its unlock key, or the key is wrong."; return; }
      }
      const type = mimeFor(name);
      const blob = new Blob([bytes], { type: type });
      const url = URL.createObjectURL(blob);
      document.getElementById("title").textContent = name;
      status.textContent = "Shared file";
      const ext = fileExt(name);
      const box = document.getElementById("player");
      if (type.startsWith("video/") || ext === "mp4") {
        document.getElementById("card").classList.add("has-player");
        const video = document.createElement("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        video.src = url;
        box.append(video);
      } else if (type.startsWith("audio/") || ext === "mp3") {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.preload = "metadata";
        audio.src = url;
        box.append(audio);
      }
      const save = document.getElementById("save");
      save.hidden = false;
      save.onclick = () => {
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
      };
    })();
  </script>
</body>
</html>
