<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared file · SafeKeeping</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #05070c; --ink: #f4f6fb; --muted: #9aa3b5; --accent: #5b9dff; --card: rgba(18, 22, 32, 0.55); --line: rgba(255,255,255,0.12); --glass-edge: rgba(255,255,255,0.22); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.45 Outfit, sans-serif; color: var(--ink); padding: 24px;
      background: var(--bg);
    }
    .atmosphere { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .atmosphere .sky {
      position: absolute; inset: -30%;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(91,157,255,.38), transparent 52%),
        radial-gradient(ellipse at 82% 18%, rgba(90,140,255,.34), transparent 48%),
        radial-gradient(ellipse at 48% 88%, rgba(160,90,255,.22), transparent 52%);
      filter: blur(42px);
      animation: aurora-shift 22s ease-in-out infinite alternate;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); mix-blend-mode: screen; will-change: transform; }
    .orb-a {
      width: min(520px, 54vw); height: min(520px, 54vw); background: rgba(91,157,255,.4);
      top: -18%; left: -14%; animation: orb-a 26s ease-in-out infinite alternate;
    }
    .orb-b {
      width: min(400px, 42vw); height: min(400px, 42vw); background: rgba(70,130,220,.32);
      right: -16%; bottom: 4%; animation: orb-b 34s ease-in-out infinite alternate;
    }
    @keyframes orb-a {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(18vw, 22vh) scale(1.2); }
    }
    @keyframes orb-b {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-16vw, -14vh) scale(1.15); }
    }
    @keyframes aurora-shift {
      0% { transform: translate(-4%, -2%) rotate(0deg) scale(1); }
      100% { transform: translate(6%, 4%) rotate(8deg) scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .atmosphere .sky { animation: none !important; }
    }
    main {
      width: min(440px, 100%); background: var(--card); border: 1px solid var(--glass-edge);
      border-radius: 22px; padding: 28px;
      backdrop-filter: saturate(180%) blur(28px);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      box-shadow: 0 18px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    }
    main.has-player, main.has-list { width: min(720px, 100%); }
    .files { list-style: none; margin: 0 0 16px; padding: 0; max-height: 55vh; overflow: auto; }
    .files li {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px;
    }
    .files li:first-child { border-top: 0; padding-top: 0; }
    .files button.link { background: transparent; color: var(--ink); padding: 0; font-weight: 600; border: 0; text-align: left; }
    .files button.link:hover { text-decoration: underline; }
    .files .meta { color: var(--muted); font-size: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .mark { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; background: #0a0a0a; flex-shrink: 0; }
    .mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
    h1 { margin: 0 0 8px; font: 650 24px/1.2 Fraunces, Georgia, serif; word-break: break-word; }
    p { margin: 0 0 16px; color: var(--muted); }
    .player-stage { position: relative; background: #050807; border-radius: 12px; overflow: hidden; margin: 0 0 12px; }
    video, audio { width: 100%; display: block; background: #0a0a0a; }
    audio { height: 48px; border-radius: 12px; margin: 0 0 16px; }
    .cue-layer { position: absolute; left: 8%; right: 8%; display: flex; justify-content: center; text-align: center; pointer-events: none; }
    .pos-bottom { bottom: 14%; } .pos-middle { top: 50%; transform: translateY(-50%); } .pos-top { top: 10%; }
    .cue-chip { display: none; padding: 4px 10px; border-radius: 6px; font: 560 18px/1.35 Fraunces, Georgia, serif; white-space: pre-line; }
    .cue-chip.on { display: inline-block; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    button { appearance: none; border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 650; background: var(--accent); color: #071018; cursor: pointer; }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .sub { margin: 0 0 16px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; display: none; grid-gap: 8px; }
    .sub.on { display: grid; }
    .err { color: #e8a0a0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><div class="sky"></div><div class="orb orb-a"></div><div class="orb orb-b"></div></div>
  <main id="card">
    <div class="brand">
      <div class="mark" aria-hidden="true"><img src="/logo.png" alt="" /></div>
      SafeKeeping
    </div>
    <h1 id="title">Shared file</h1>
    <p id="status">Opening the link…</p>
    <ul id="files" class="files hidden"></ul>
    <div id="player"></div>
    <button type="button" id="save" hidden>Download</button>
    <button type="button" id="open-vault" class="ghost" hidden>Open in my vault</button>
  </main>
  <script>
    function unb64url(s) {
      s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      return Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    }
    function fileExt(name) { return (String(name || "").split(".").pop() || "").toLowerCase(); }
    function mimeFor(name) {
      switch (fileExt(name)) {
        case "mp4": case "m4v": return "video/mp4";
        case "webm": return "video/webm";
        case "mov": return "video/quicktime";
        case "mp3": return "audio/mpeg";
        case "m4a": return "audio/mp4";
        case "wav": return "audio/wav";
        case "ogg": case "oga": return "audio/ogg";
        case "pdf": return "application/pdf";
        default: return "application/octet-stream";
      }
    }
    function srtTime(raw) {
      const s = String(raw || "").trim().replace(",", ".");
      const p = s.split(":");
      if (p.length === 2) return (+p[0] || 0) * 60 + parseFloat(p[1] || "0");
      if (p.length >= 3) return (+p[0] || 0) * 3600 + (+p[1] || 0) * 60 + parseFloat(p[2] || "0");
      return 0;
    }
    function parseSrt(text) {
      text = String(text || "").replace(/^\uFEFF/, "").replace(/\r/g, "");
      const cues = [];
      for (const block of text.split(/\n{2,}/)) {
        const lines = block.split("\n").filter((l) => l.trim() !== "");
        if (!lines.length) continue;
        let i = /^\d+$/.test(lines[0]) ? 1 : 0;
        if (!/-->/.test(lines[i] || "")) continue;
        const [a, b] = lines[i].split(/\s*-->\s*/);
        const body = lines.slice(i + 1).join("\n").replace(/<[^>]+>/g, "");
        if (body) cues.push({ start: srtTime(a), end: srtTime((b || "").split(/\s+/)[0]), text: body });
      }
      return cues;
    }
    async function decryptBody(buf, fek) {
      const bytes = new Uint8Array(buf);
      if (bytes.length < 29) throw new Error("truncated");
      const iv = bytes.slice(0, 12);
      const ct = bytes.slice(12);
      const key = await crypto.subtle.importKey("raw", fek, "AES-GCM", false, ["decrypt"]);
      return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct));
    }
    function formatSize(n) {
      const u = ["B", "KB", "MB", "GB"];
      let i = 0;
      n = Number(n) || 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i += 1; }
      return (i ? n.toFixed(i > 1 ? 1 : 0) : String(n)) + " " + u[i];
    }
    function fileURL(token, rel) {
      return "/s/" + encodeURIComponent(token) + "/file/" + String(rel || "").split("/").filter(Boolean).map(encodeURIComponent).join("/");
    }
    function showFile(name, bytes) {
      const type = mimeFor(name);
      const url = URL.createObjectURL(new Blob([bytes], { type }));
      document.getElementById("title").textContent = name;
      document.getElementById("status").textContent = "Shared file";
      const ext = fileExt(name);
      const box = document.getElementById("player");
      box.innerHTML = "";
      if (type.startsWith("video/") || ext === "mp4") {
        document.getElementById("card").classList.add("has-player");
        const stage = document.createElement("div");
        stage.className = "player-stage";
        const video = document.createElement("video");
        video.controls = true; video.playsInline = true; video.src = url;
        const layer = document.createElement("div");
        layer.className = "cue-layer pos-bottom";
        const chip = document.createElement("span");
        chip.className = "cue-chip";
        layer.append(chip);
        stage.append(video, layer);
        const tools = document.createElement("div");
        tools.className = "tools";
        const add = document.createElement("button");
        add.className = "ghost"; add.textContent = "Add .srt";
        const gear = document.createElement("button");
        gear.className = "ghost"; gear.textContent = "Subtitle settings";
        const input = document.createElement("input");
        input.type = "file"; input.accept = ".srt,.vtt"; input.className = "hidden";
        tools.append(add, gear);
        const set = { size: 18, color: "#f6f1e6", bg: 0.55, pos: "bottom", delay: 0 };
        try { Object.assign(set, JSON.parse(localStorage.getItem("minicloud.subs") || "{}")); } catch {}
        const panel = document.createElement("div");
        panel.className = "sub";
        panel.innerHTML = "<label>Size</label><input id='ss' type='range' min='14' max='36'><label>Background</label><input id='sb' type='range' min='0' max='0.85' step='0.05'>";
        let cues = [];
        const paint = () => {
          chip.style.fontSize = set.size + "px";
          chip.style.color = set.color;
          chip.style.background = "rgba(8,10,9," + set.bg + ")";
          layer.className = "cue-layer pos-" + set.pos;
          localStorage.setItem("minicloud.subs", JSON.stringify(set));
        };
        paint();
        const tick = () => {
          const t = video.currentTime + (Number(set.delay) || 0);
          const hit = cues.find((c) => t >= c.start && t <= c.end);
          chip.textContent = hit ? hit.text : "";
          chip.classList.toggle("on", !!hit);
          paint();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        add.onclick = () => input.click();
        gear.onclick = () => panel.classList.toggle("on");
        input.onchange = async () => {
          if (!input.files[0]) return;
          cues = parseSrt(await input.files[0].text());
        };
        panel.querySelector("#ss").value = set.size;
        panel.querySelector("#sb").value = set.bg;
        panel.querySelector("#ss").oninput = (e) => { set.size = +e.target.value; };
        panel.querySelector("#sb").oninput = (e) => { set.bg = +e.target.value; };
        box.append(stage, tools, input, panel);
      } else if (type.startsWith("audio/") || ext === "mp3") {
        const audio = document.createElement("audio");
        audio.controls = true; audio.src = url;
        box.append(audio);
      }
      const save = document.getElementById("save");
      save.hidden = false;
      save.onclick = () => {
        const a = document.createElement("a");
        a.href = url; a.download = name; a.click();
      };
    }
    (async () => {
      const status = document.getElementById("status");
      const parts = location.pathname.split("/").filter(Boolean);
      const token = parts[0] === "s" ? parts[1] : parts.pop();
      const fekPart = location.hash.replace(/^#/, "");
      const infoRes = await fetch("/s/" + encodeURIComponent(token) + "/info");
      if (!infoRes.ok) {
        status.className = "err";
        status.textContent = infoRes.status === 410 ? "This link has expired." : "This link is missing or the file is gone.";
        return;
      }
      const info = await infoRes.json();
      const role = info.role === "editor" ? "editor" : "viewer";
      const expiry = info.never ? "This link does not expire." : (info.expires ? "This link expires " + info.expires.replace("T", " ").replace("Z", " UTC") + "." : "");
      if (info.kind === "folder") {
        document.title = (info.name || "Shared folder") + " · SafeKeeping";
        document.getElementById("title").textContent = info.name || "Shared folder";
        document.getElementById("card").classList.add("has-list");
        status.textContent = (role === "editor" ? "Anyone with this link can view, and signed-in people can edit. " : "Anyone with this link can look and download. ") + expiry;
        const list = document.getElementById("files");
        list.classList.remove("hidden");
        const files = info.files || [];
        const prefixes = info.prefixes || [];
        if (!files.length && !prefixes.length) {
          const empty = document.createElement("li");
          empty.textContent = "This folder is empty.";
          list.append(empty);
        }
        prefixes.forEach((prefix) => {
          const li = document.createElement("li");
          const name = String(prefix).replace(/\/+$/, "").split("/").pop() || prefix;
          const label = document.createElement("div");
          label.textContent = name;
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = "Folder";
          li.append(label, meta);
          list.append(li);
        });
        files.forEach((f) => {
          const li = document.createElement("li");
          const open = document.createElement("button");
          open.type = "button";
          open.className = "link";
          open.textContent = f.key;
          open.onclick = () => {
            const a = document.createElement("a");
            a.href = fileURL(token, f.key);
            a.download = String(f.key).split("/").pop();
            a.click();
          };
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = formatSize(f.size);
          li.append(open, meta);
          list.append(li);
        });
        const session = localStorage.getItem("minicloud.token");
        const vault = document.getElementById("open-vault");
        if (session) {
          vault.hidden = false;
          vault.onclick = async () => {
            const res = await fetch("/v1/shares/" + encodeURIComponent(token) + "/join", {
              method: "POST",
              headers: { Authorization: "Bearer " + session },
            });
            if (!res.ok) {
              status.className = "err";
              const data = await res.json().catch(() => ({}));
              status.textContent = data.error || "Could not open this folder in your vault.";
              return;
            }
            location.href = "/";
          };
        } else if (role === "editor") {
          vault.hidden = false;
          vault.textContent = "Sign in to edit";
          vault.onclick = () => { location.href = "/"; };
        }
        return;
      }
      const res = await fetch("/s/" + encodeURIComponent(token) + "/raw");
      if (!res.ok) {
        status.className = "err";
        status.textContent = res.status === 410 ? "This link has expired." : "This link is missing or the file is gone.";
        return;
      }
      const name = info.name || (res.headers.get("Content-Disposition") || "").split("filename=")[1]?.replace(/"/g, "") || "download";
      let bytes = new Uint8Array(await res.arrayBuffer());
      if (fekPart) {
        try { bytes = await decryptBody(bytes.buffer, unb64url(fekPart)); }
        catch { status.className = "err"; status.textContent = "This link is missing its unlock key, or the key is wrong."; return; }
      }
      showFile(name, bytes);
      if (expiry) status.textContent = "Shared file · " + (role === "editor" ? "editor link. " : "") + expiry;
    })();
  </script>
</body>
</html>
